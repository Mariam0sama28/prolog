<!DOCTYPE html>
<html lang="eng">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>the task organizer</title>
     <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
     <script src="{{ url_for('static', filename='app.js') }}"></script>
    <main class="container">
      <header>
        <h1>the task organizer</h1>مريومة اجمل بنوتة — Powered by Prolog</p>
      </header>

      <section class="card form-card">
        <h2> add new task </h2>
        <form id="taskForm">
          <div class="row">
            <input id="name" placeholder="task name" required />
            <select id="priority">
              <option value="HIGH"> HIGH</option>
              <Option value="medium"> medium</Option>
              <option value="low">low</option>
            </select>
          </div>
          <div class="row">
            <input
              id="duration"
              placeholder="المدة (ساعات)"
              type="number"
              min="0.25"
              step="0.25"
              required
            />
            <input id="deadline" type="date" />
          </div>
          <div class="row actions">
            <button type="submit" class="btn primary">add task</button>
            <button type="button" id="refreshBtn" class="btn">
              update list
            </button>
          </div>
        </form>
        <div id="msg" class="msg"></div>
      </section>

      <section class="card list-card">
        <h2>tasks list</h2>
        <ul id="tasksList" class="tasks-list"></ul>
        {% for task in tasks %}
        <div class="actions-row">
          <button id="generatePlan" class="btn gradient">
            {{task.name}}
          </button>
          <button id="clearBtn" class="btn danger">delete all plans</button>
        </div>
        {% endfor %}
      </section>

      <section class="card plan-card" id="planCard" style="display: none">
        <h2>suggest plan</h2>
        <ol id="planList"></ol>
      </section>

      <footer>
        <small>developed by eman & mariam</small>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
